name: Release

# Publishing a GitHub Release is what starts this: write the notes, publish, and
# the binaries and the crates.io release follow. The release therefore exists
# before its assets do — expect a few minutes with the notes up and nothing
# attached.
#
# The tag is the single source of the version. Nothing in the tree records it:
# `version` in Cargo.toml is a placeholder the crates.io job rewrites from the
# tag, so cutting a release never means remembering to bump a file first.
on:
  release:
    types: [published]

permissions:
  contents: write

# The tag reaches every step through the environment rather than being
# interpolated into a script, so its text can never be read as shell.
env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  # Shared with CI, which runs the same matrix on every pull request — see
  # build.yml for why the definition is not duplicated here.
  build:
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.event.release.tag_name }}

  # One job owns the upload so the matrix builds cannot race, and so the checksums
  # are computed from exactly the bytes that get attached.
  release:
    name: attach assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          for f in kuchiyose-*.tar.gz; do
            sha256sum "$f" > "$f.sha256"
          done
          cat ./*.sha256

      # `gh release upload` only adds assets. An action that creates-or-updates
      # the release could rewrite the notes that were just published by hand,
      # which is the one thing this job must not touch. --clobber keeps a re-run
      # idempotent instead of failing on an asset that is already there.
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks the source out — it only needs the artifacts —
          # so gh has no git remote to infer the repository from and must be
          # told explicitly.
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber

  # Gated on the cross-platform build because this is the one step in the file a
  # re-run cannot undo: a crates.io version is permanent — it can be yanked, but
  # never replaced or deleted — so a target that stopped compiling should stop
  # the publish rather than be discovered afterwards.
  crates-io:
    name: publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: the OIDC token minted for this job is exchanged for
      # a crates.io token that lives minutes, so no long-lived registry
      # credential is stored in this repository at all. `contents: read` narrows
      # the file-level `contents: write`, which only the asset upload needs.
      #
      # crates.io must know this job first: every crate's Settings > Trusted
      # Publishing names this repository, `release.yml`, and this job's
      # environment (none). That registration can only be made on a crate that
      # already exists, so the very first version of each crate is published
      # by hand.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Set version from tag
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # cargo would reject a non-semver version much later, after the
          # verification build; fail on the tag itself instead. Close enough to
          # semver that anything reaching cargo is accepted there: no leading
          # zeros, a prerelease before build metadata, one of each at most.
          printf '%s' "$version" |
            grep -Eq '^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' || {
            echo "tag ${TAG} does not name a semver version" >&2
            exit 1
          }
          # The version reaches perl through the environment, not through the
          # program text, so a tag can never be read as code. Two shapes of line
          # in the root Cargo.toml carry the placeholder, and only those are
          # touched: the line-anchored `version =` of [workspace.package], which
          # every crate inherits, and the exact `version = "=…"` requirement of
          # each [workspace.dependencies] entry, which every crate depending on
          # another member inherits.
          VERSION="$version" perl -pi -e '
            s/^version = "[^"]*"$/version = "$ENV{VERSION}"/;
            s/^(kuchiyose-[a-z]+ = \{ path = "[^"]+", version = )"=[^"]*"/$1"=$ENV{VERSION}"/;
          ' Cargo.toml
          # A line that stopped matching the patterns above would otherwise ship
          # a crate that still says 0.0.0, or depends on one that does. cargo
          # itself refuses a path dependency whose version the requirement does
          # not match, so checking the members covers the requirements too.
          cargo metadata --no-deps --format-version 1 |
            jq -e --arg v "$version" '[.packages[].version] | all(. == $v)' >/dev/null || {
            echo "not every workspace member reads ${version} after the rewrite" >&2
            exit 1
          }
          # `--workspace` re-resolves workspace members only — a dependency is
          # touched solely if it has gone missing from the lock — so what gets
          # published carries the tagged commit's dependency set, and --locked
          # below still means the committed lock.
          cargo update --workspace
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Re-running the workflow on a release whose crates are partly or wholly up
      # must finish the rest rather than fail on the first one crates.io already
      # holds — a publish that died halfway leaves exactly that state. Each crate
      # is checked on its own, and only the missing ones are handed to cargo.
      - name: Find the crates not yet published
        id: check
        run: |
          set -euo pipefail
          pending=()
          for name in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: kuchiyose release workflow (https://github.com/lambdalisue/kuchiyose)' \
              "https://crates.io/api/v1/crates/${name}/${VERSION}")
            case "$code" in
              200) echo "${name} ${VERSION} is already on crates.io" ;;
              404) pending+=("$name") ;;
              *)   echo "unexpected status ${code} from crates.io for ${name}" >&2; exit 1 ;;
            esac
          done
          echo "pending: ${pending[*]:-(none)}"
          # Written as `-p <name>` pairs for the publish step to split on spaces.
          args=""
          for name in "${pending[@]}"; do args="${args} -p ${name}"; done
          echo "args=${args# }" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.check.outputs.args != ''

      # cargo orders the selected crates by their dependencies and waits for each
      # to appear in the index before publishing the next, so the order is not
      # written down here. A crate left out because it is already up resolves
      # from crates.io instead, at the exact version the rewrite pinned.
      #
      # --allow-dirty: the rewrite above leaves Cargo.toml and Cargo.lock
      # modified against the tagged commit, which is the whole design — the
      # version is never committed. The packaged files are the working tree's,
      # so each crate carries the tag's version.
      - name: Publish
        if: steps.check.outputs.args != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PUBLISH_ARGS: ${{ steps.check.outputs.args }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # split into `-p <name>` words on purpose
          cargo publish --locked --allow-dirty $PUBLISH_ARGS
