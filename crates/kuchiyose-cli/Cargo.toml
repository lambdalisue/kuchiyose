[package]
name = "kuchiyose-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kuchiyose"
path = "src/main.rs"

[dependencies]
kuchiyose-doc = { path = "../kuchiyose-doc" }
kuchiyose-katashiro = { path = "../kuchiyose-katashiro" }
kuchiyose-metrics = { path = "../kuchiyose-metrics" }
kuchiyose-normalize = { path = "../kuchiyose-normalize" }
kuchiyose-prompt = { path = "../kuchiyose-prompt" }
kuchiyose-review = { path = "../kuchiyose-review" }
kuchiyose-scale = { path = "../kuchiyose-scale" }
# 表の桁を和文の見える幅で揃える。dialoguer が既に使う。
console = { version = "0.16", default-features = false, features = ["std", "unicode-width"] }
# katashiro edit の対話画面。対話はここだけにする。
dialoguer = { version = "0.12", default-features = false }

[lints]
workspace = true
