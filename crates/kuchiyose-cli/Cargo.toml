[package]
name = "kuchiyose"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "LLM にあなたの代わりに日本語の文章を書かせ、あなたの書き方からのずれを数えて直させる"
readme = "../../README.md"
keywords = ["japanese", "writing", "llm", "stylometry", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "kuchiyose"
path = "src/main.rs"

[dependencies]
kuchiyose-doc = { workspace = true }
kuchiyose-katashiro = { workspace = true }
kuchiyose-metrics = { workspace = true }
kuchiyose-normalize = { workspace = true }
kuchiyose-prompt = { workspace = true }
kuchiyose-review = { workspace = true }
kuchiyose-scale = { workspace = true }
# 表の桁を和文の見える幅で揃える。dialoguer が既に使う。
console = { version = "0.16", default-features = false, features = ["std", "unicode-width"] }
# katashiro edit の対話画面。対話はここだけにする。
dialoguer = { version = "0.12", default-features = false }

[lints]
workspace = true
