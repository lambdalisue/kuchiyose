[package]
name = "kakiburi-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kakiburi"
path = "src/main.rs"

[dependencies]
kakiburi-cassette = { path = "../kakiburi-cassette" }
kakiburi-doc = { path = "../kakiburi-doc" }
kakiburi-metrics = { path = "../kakiburi-metrics" }
kakiburi-normalize = { path = "../kakiburi-normalize" }
kakiburi-review = { path = "../kakiburi-review" }
kakiburi-scale = { path = "../kakiburi-scale" }
# 表の桁を和文の見える幅で揃える。dialoguer が既に使う。
console = { version = "0.16", default-features = false, features = ["std", "unicode-width"] }
# cassette edit の対話画面。対話はここだけにする。
dialoguer = { version = "0.12", default-features = false }

[lints]
workspace = true
