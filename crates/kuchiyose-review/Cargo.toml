[package]
name = "kuchiyose-review"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "kuchiyose の検め。文書を目盛りに照らして判定と指摘を返す"
keywords = ["japanese", "writing", "stylometry", "nlp"]
categories = ["text-processing"]

# <strong>kuchiyose-scale に依存しない。</strong>
#
# 依存すると、検める文書を見てから重みや語彙を作り直せる経路が開く。
# 目盛りは作り終えた形で渡ってくるものであって、ここで作るものではない。
# 仕様が「黙って壊れる」と名指しした 4 か所のうちの 1 つを、境界で止める。
[dependencies]
kuchiyose-metrics = { workspace = true }

[lints]
workspace = true
