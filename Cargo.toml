[workspace]
resolver = "2"
members = [
    "crates/kuchiyose-doc",
    "crates/kuchiyose-normalize",
    "crates/kuchiyose-metrics",
    "crates/kuchiyose-scale",
    "crates/kuchiyose-review",
    "crates/kuchiyose-katashiro",
    "crates/kuchiyose-prompt",
    "crates/kuchiyose-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
